version: '3.8'
services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
      - /:/host:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - HOST_VAR=/host/var
      - HOST_RUN=/host/run
      - HOST_DEV=/host/dev
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "8889:8889"
      - "8888:8888"
    networks:
      - otel-net

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - otel-net
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana-chat-assistant/dist:/var/lib/grafana/plugins/grafana-chat-assistant
      - ./grafana-dashboard-exporter/dist:/var/lib/grafana/plugins/grafana-dashboard-exporter
      - ./grafana-sqlserver-datasource/dist:/var/lib/grafana/plugins/grafana-sqlserver-datasource
      - ./grafana-weekday-avg-transform/dist:/var/lib/grafana/plugins/grafana-weekday-avg-transform
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-chat-assistant,grafana-dashboard-exporter,grafana-sqlserver-datasource,grafana-weekday-avg-transform
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - otel-net

networks:
  otel-net:

volumes:
  grafana-data:
